# Production Configuration for Render Deployment
spring.application.name=therma-trace-backend

# Database Configuration - Use environment variables from Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.thermatrace.thermatracebackend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Application Information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration - Use environment variables
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Server Configuration
server.port=${PORT:8080}

# Production Security
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Logging Configuration
logging.level.root=INFO
logging.level.com.thermatrace=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN